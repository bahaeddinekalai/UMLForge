# cargo-nextest configuration. Used by `cargo nextest run` and `cargo llvm-cov nextest`.

[profile.default]
fail-fast = false

[profile.ci]
fail-fast = false
# Legacy nextest configuration. The active settings are in `.config/nextest.toml`.
retries = 1
slow-timeout = { period = "30s", terminate-after = 4 }

# Writes target/nextest/ci/junit.xml when using the legacy filename.
[profile.ci.junit]
path = "junit.xml"