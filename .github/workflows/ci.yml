name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the `dioxus` version in Cargo.toml.
  DIOXUS_CLI_VERSION: "0.7.1"

jobs:
  lint-test:
    name: Format, clippy, tests, layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask layers
      - run: cargo xtask parity

  wasm-check:
    name: wasm32 check (L0-L6 must compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask wasm

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - name: Build web app
        working-directory: apps/umlforge-web
        run: dx build --platform web --release
      - uses: actions/upload-artifact@v4
        with:
          name: umlforge-web
          path: target/dx/umlforge-web/release/web/public
          if-no-files-found: error

  windows-build:
    name: Windows build
    runs-on: windows-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - name: Test (native crates on Windows)
        run: cargo test --workspace
      - name: Bundle desktop app
        working-directory: apps/umlforge-desktop
        run: dx bundle --platform desktop --release
      - uses: actions/upload-artifact@v4
        with:
          name: umlforge-windows
          path: target/dx/umlforge-desktop/bundle
          if-no-files-found: error