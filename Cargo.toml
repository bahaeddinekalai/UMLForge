[workspace]
resolver = "2"
members = [
    "apps/umlforge-cli",
    "apps/umlforge-desktop",
    "apps/umlforge-web",
    "crates/automation",
    "crates/codegen",
    "crates/diagram",
    "crates/engine",
    "crates/format",
    "crates/geom",
    "crates/history",
    "crates/io",
    "crates/layout",
    "crates/model",
    "crates/plugins",
    "crates/render",
    "crates/testkit",
    "crates/ui",
    "crates/validate",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bahaeddinekalai/UMLForge"

[workspace.dependencies]
dioxus = { version = "=0.7.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Location"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
